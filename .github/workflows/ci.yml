name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Típusok, lint, tesztek
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Függőségek telepítése
        run: npm ci

      - name: Prisma kliens generálása
        run: npx prisma generate

      - name: Típusellenőrzés
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Egységtesztek
        run: npm test

  # The check that a deploy actually needs.
  #
  # `next build` runs inside an image builder — Render, Fly, a Docker layer —
  # where no database is reachable. The `build` job below provisions Postgres so
  # it can also boot the app and hit real routes, which means it would happily
  # stay green while every deploy failed. That is not hypothetical: it is exactly
  # what happened, and this job is the one that reproduces it.
  #
  # DATABASE_URL points at a closed port on purpose. Any query issued during the
  # build fails here, loudly, in seconds.
  build-without-database:
    name: Build adatbázis nélkül
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://nobody:nobody@127.0.0.1:1/nincs_ilyen
      AUTH_SECRET: ci-only-secret-value-long-enough-for-validation-abcdef
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      MAIL_DRIVER: noop
      LOG_LEVEL: error

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Next build (adatbázis nélkül)
        run: npm run build

      # A build can exit 0 while a page silently swallowed its own query failure
      # and shipped an empty shell, so the log is checked too.
      - name: Nem történt adatbázis-hívás build közben
        run: |
          rm -rf .next
          npm run build 2>&1 | tee build.log
          # Matched against the exact phrasings, not the word "prerender" — Next
          # always prints "prerendered as static content" in its own legend.
          if grep -qE "Prisma error|Can't reach database server|Error occurred prerendering" build.log; then
            echo "::error::A build adatbázishoz fordult. Az érintett útvonalnak force-dynamic kell."
            exit 1
          fi

  build:
    name: Build és migrációs próba
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yonagi
          POSTGRES_PASSWORD: yonagi
          POSTGRES_DB: yonagi_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yonagi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://yonagi:yonagi@localhost:5432/yonagi_ci?schema=public
      DIRECT_DATABASE_URL: postgresql://yonagi:yonagi@localhost:5432/yonagi_ci?schema=public
      AUTH_SECRET: ci-only-secret-value-long-enough-for-validation-abcdef
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      MAIL_DRIVER: noop
      LOG_LEVEL: error

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Séma alkalmazása
        run: npx prisma db push --skip-generate

      - name: SQL kiegészítők (indexek, megszorítások)
        run: |
          psql "$DATABASE_URL" -f prisma/sql/01-extensions.sql
          psql "$DATABASE_URL" -f prisma/sql/02-search-indexes.sql
          psql "$DATABASE_URL" -f prisma/sql/03-constraints.sql

      - name: Seed
        run: npx tsx prisma/seed.ts
        env:
          SEED_OWNER_PASSWORD: ci-owner-password-not-used

      - name: Next build
        run: npm run build

      # A green build is not proof the app boots: the two fail in different ways.
      - name: Indítási és útvonal-ellenőrzés
        run: |
          npm start &
          APP_PID=$!
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1 && break
            sleep 2
          done

          fail=0
          for path in / /projektek /kiadasok /hirek /csapat /gyik /kapcsolat /belepes /robots.txt /sitemap.xml /rss.xml; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$path")
            printf '%-24s %s\n' "$path" "$code"
            [ "$code" = "200" ] || fail=1
          done

          # The admin panel must bounce an anonymous visitor.
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000/admin")
          printf '%-24s %s\n' "/admin (anon)" "$code"
          [ "$code" = "307" ] || [ "$code" = "302" ] || fail=1

          kill $APP_PID
          exit $fail

      # A 200-as válasz nem bizonyíték arra, hogy az oldal meg is jelenik.
      #
      # Ezt drágán tanultuk meg: a CSP-ből hiányzott a `script-src`, így a
      # böngésző blokkolta a Next beágyazott scriptjeit. A React streamelő
      # SSR-je viszont pont ezekkel emeli a helyükre a `<template>`-ekben
      # érkező tartalmat — blokkolva a HTML hiánytalanul megjött (100 kB), a
      # megjelenített oldal pedig üres maradt. A curl-alapú ellenőrzés fentebb
      # végig zöld volt, miközben minden böngészőben fekete képernyő volt.
      #
      # Ez a lépés valódi böngészőben nyitja meg az oldalakat, és a látható
      # szöveget, a `<main>` méretét és a konzolt nézi.
      - name: Böngészős füstpróba
        run: |
          npm start &
          APP_PID=$!
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1 && break
            sleep 2
          done

          npx playwright install --with-deps chromium
          SMOKE_BASE_URL=http://127.0.0.1:3000 \
          SMOKE_EMAIL=owner@yonagifansub.hu \
          SMOKE_PASSWORD="$SEED_OWNER_PASSWORD" \
          node scripts/smoke.mjs
          status=$?

          kill $APP_PID
          exit $status
        env:
          SEED_OWNER_PASSWORD: ci-owner-password-not-used

  # Runs on every pull request, not just main.
  #
  # It used to be gated on `main`, which meant the first real image build of any
  # change was the deploy itself. That is how a Dockerfile that had never worked
  # — it copied `.next/standalone` without `output: 'standalone'` ever being set,
  # and `public/`, which git does not store while empty — reached production
  # untouched. An image build takes two minutes; a failed deploy costs more.
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: yonagi-fansub:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
