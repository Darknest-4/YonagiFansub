# Render blueprint.
#
# `render.yaml` describes the whole stack, so a deploy is "connect the repo and
# apply the blueprint" rather than a dozen fields typed into a dashboard and
# forgotten. Import it via Render → Blueprints → New Blueprint Instance.
#
# Two things this file deliberately does NOT do:
#
#   • It never contains a secret. `AUTH_SECRET` is generated by Render itself
#     (`generateValue`), the database URLs come from the managed instance, and
#     anything that has to be typed by a human is marked `sync: false` so Render
#     asks for it instead of reading it from a committed file.
#
#   • It does not run migrations during the build. A Render build runs in an
#     image builder that cannot reach the database — the same constraint that
#     makes every page `force-dynamic`. Schema changes belong in `preDeployCommand`,
#     which runs after the image is built and before traffic is switched over.
#
# One thing to know before shipping a destructive migration (a dropped table, a
# dropped column): during a rolling deploy the OLD instance is still serving, so
# it still holds read locks on the tables the migration wants to rewrite. A
# `DROP TABLE` cannot get its lock, and the deploy deadlocks — the old instance
# will not stop until the new one is healthy, and the new one cannot become
# healthy until the old one stops. Such a migration needs the service suspended
# for the length of the deploy. `scripts/db-migrate.mjs` detects the situation
# and says so instead of hanging; docs/runbook.md has the procedure.

databases:
  - name: yonagi-db
    databaseName: yonagi
    user: yonagi
    plan: basic-256mb # Postgres 16; raise before the catalogue gets large.
    postgresMajorVersion: '16'
    ipAllowList: [] # Reachable only from inside Render's network.

services:
  - type: web
    name: yonagi-fansub
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt # Closest to a Hungarian audience.
    branch: main
    autoDeployTrigger: commit

    # Runs after the image is built, with the database reachable, and BEFORE the
    # new container is started. That placement is the whole point: the same three
    # steps also run in `scripts/start.sh`, but there they happen inside the
    # container's startup, racing the platform's port-scan window — a slow or
    # blocked step there shows up as an unexplained deploy timeout rather than as
    # an error. Here it fails as a failed pre-deploy, with the output visible.
    #
    # Every step is idempotent, so having run them here makes the copies in
    # `start.sh` fast no-ops, and a redeploy is always safe.
    #
    # `db-migrate.mjs` rather than `prisma migrate deploy`: it sets a lock_timeout
    # so a blocked DDL fails in seconds instead of hanging forever, reports which
    # session holds the lock, and clears a half-finished migration so the retry
    # can proceed. See docs/runbook.md → „A deploy elakadt a migrációnál".
    preDeployCommand: >-
      node scripts/db-migrate.mjs
      && node_modules/.bin/tsx scripts/apply-sql.ts
      && node_modules/.bin/tsx prisma/seed.ts

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: yonagi-db
          property: connectionString

      # Prisma runs migrations and DDL over this one. On Render's managed
      # Postgres it is the same endpoint; keeping it separate means moving to a
      # pooler later is a one-line change rather than a debugging session.
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: yonagi-db
          property: connectionString

      # Generated once by Render and never shown in the repo. Rotating it logs
      # every user out, which is the intended behaviour after a compromise.
      - key: AUTH_SECRET
        generateValue: true

      # Must match the real https origin: the `__Host-` cookie prefix and the
      # same-origin check both depend on it. Render asks for this on apply.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

      # A single web instance keeps the in-memory rate limiter correct. Add a
      # Render Key Value instance and switch to `redis` before scaling out —
      # the memory driver counts per instance, so two instances double the limit.
      - key: RATE_LIMIT_DRIVER
        value: memory

      # Mail goes through Resend's HTTP API — no SMTP egress, no extra
      # dependency, and nothing to configure here beyond the key itself.
      #
      # Render asks for RESEND_API_KEY once while applying the blueprint, and
      # that is the only mail field a human has to touch. It is `sync: false`
      # rather than a committed value on purpose: a key in this file is a key in
      # the repository, which GitHub's secret scanner reports and bots try within
      # minutes of the first push. Revoking it later does not remove it from the
      # history.
      - key: MAIL_DRIVER
        value: resend
      - key: RESEND_API_KEY
        sync: false

      # The sender. **Its domain has to be verified in Resend**
      # (https://resend.com/domains) or every send comes back 422 — which the
      # driver logs with that exact instruction. Until the domain is verified,
      # `onboarding@resend.dev` works, but only delivers to the address that owns
      # the Resend account.
      - key: MAIL_FROM
        value: Yonagi Fansub <noreply@yonagifansub.hu>

      # SMTP stays available as an alternative: set MAIL_DRIVER=smtp and fill
      # these in instead. Left empty, they cost nothing.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

      # Render's filesystem is ephemeral: anything written by one deploy is gone
      # after the next. Uploads therefore need either the disk mounted below or
      # MEDIA_DRIVER=s3 (Cloudflare R2, Backblaze B2, AWS S3).
      - key: MEDIA_DRIVER
        value: local
      - key: MEDIA_LOCAL_DIR
        value: /var/data/uploads
      - key: MEDIA_PUBLIC_BASE_URL
        value: /uploads

      - key: LOG_LEVEL
        value: info

      # Optional: a Sentry-compatible DSN. Unset means errors go to the Render
      # log and nowhere else.
      - key: ERROR_REPORTING_DSN
        sync: false

      # Shared secret for the daily maintenance job below.
      - key: CRON_SECRET
        generateValue: true

    # Persistent storage for MEDIA_DRIVER=local. A disk pins the service to one
    # instance — that is the trade being made here, and it is the right one at
    # this size. Remove it and set MEDIA_DRIVER=s3 to scale horizontally.
    disk:
      name: yonagi-media
      mountPath: /var/data
      sizeGB: 5

  # Expired sessions, stale notifications and download events, scheduled
  # releases and news that are now due, audit log retention. Every step is
  # idempotent: a missed run delays work, it does not corrupt anything.
  - type: cron
    name: yonagi-daily
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    schedule: '0 3 * * *'
    buildCommand: npm ci
    # GET, matching the handler in `app/api/cron/daily/route.ts`. `-f` makes a
    # non-2xx response fail the job, so a rejected secret shows up as a failed
    # cron run rather than a job that silently succeeds while doing nothing.
    startCommand: >-
      curl -fsS -H "X-Cron-Secret: $CRON_SECRET"
      "$NEXT_PUBLIC_SITE_URL/api/cron/daily"
    envVars:
      - key: CRON_SECRET
        fromService:
          type: web
          name: yonagi-fansub
          envVarKey: CRON_SECRET
      - key: NEXT_PUBLIC_SITE_URL
        fromService:
          type: web
          name: yonagi-fansub
          envVarKey: NEXT_PUBLIC_SITE_URL
