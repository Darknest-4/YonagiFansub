# Local development / self-hosted deployment stack.
#
#   docker compose up -d          → Postgres, Redis and the app
#   docker compose --profile tools up -d   → adds Adminer for DB inspection
#
# For production, put a TLS-terminating reverse proxy (Caddy, nginx, Traefik) in
# front of `app` and set NEXT_PUBLIC_SITE_URL to the public https:// origin.
# See docs/deployment.md.

name: yonagi

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yonagi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-yonagi}
      # Deterministic collation, so ORDER BY does not change under a locale update.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./prisma/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-yonagi} -d ${POSTGRES_DB:-yonagi}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Not published to the host by default: the app reaches it over the compose
    # network. Uncomment for local psql access.
    # ports: ['5432:5432']

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-yonagi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-yonagi}?schema=public&connection_limit=10
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-yonagi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-yonagi}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required – generate with: openssl rand -base64 48}
      RATE_LIMIT_DRIVER: redis
      REDIS_URL: redis://redis:6379
      MAIL_DRIVER: ${MAIL_DRIVER:-console}
      MAIL_FROM: ${MAIL_FROM:-Yonagi Fansub <noreply@yonagifansub.hu>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${APP_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  # One-shot: applies migrations and reconciles roles/permissions/settings.
  # Run after every deploy:  docker compose run --rm migrate
  migrate:
    build:
      context: .
    profiles: ['tools']
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-yonagi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-yonagi}?schema=public
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-yonagi}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-yonagi}?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-owner@yonagifansub.hu}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-}
    command: ['sh', '-c', 'npx prisma migrate deploy && npx tsx prisma/seed.ts']

  adminer:
    image: adminer:latest
    profiles: ['tools']
    restart: unless-stopped
    depends_on: [db]
    ports: ['8080:8080']
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula

volumes:
  db-data:
  redis-data:
